<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>CSG Forge — Parametric Boolean Workbench</title>
	<meta name="description" content="A worker-backed parametric CSG modelling workbench built on three-bvh-csg.">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131a21'/%3E%3Crect x='6.5' y='6.5' width='13' height='13' rx='2.5' fill='none' stroke='%235ac8fa' stroke-width='1.8'/%3E%3Ccircle cx='20' cy='20' r='6.5' fill='none' stroke='%23f0a35e' stroke-width='1.8' stroke-dasharray='2.4 2'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="./workbench/workbench.css">
</head>
<body>
	<div id="app">
		<header class="topbar">
			<div class="brand">
				<div class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 32 32" fill="none">
						<rect x="3.5" y="3.5" width="17" height="17" rx="3" stroke="currentColor" stroke-width="1.6"/>
						<circle cx="20" cy="20" r="8.5" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2.4"/>
					</svg>
				</div>
				<div class="brand-text">
					<strong>CSG&nbsp;Forge</strong>
					<span>parametric boolean workbench</span>
				</div>
			</div>

			<nav class="presets" id="presets" aria-label="Presets"></nav>

			<div class="actions">
				<div class="btn-group">
					<button class="icon-btn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
						<svg viewBox="0 0 20 20"><path d="M7.5 5.5 4 9l3.5 3.5M4 9h7.5a4.5 4.5 0 0 1 0 9H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
					</button>
					<button class="icon-btn" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
						<svg viewBox="0 0 20 20"><path d="M12.5 5.5 16 9l-3.5 3.5M16 9H8.5a4.5 4.5 0 0 0 0 9H11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
					</button>
				</div>

				<div class="menu" id="export-menu">
					<button class="primary-btn" id="export-btn" aria-haspopup="true" aria-expanded="false">
						<span>Export</span>
						<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
					</button>
					<div class="menu-panel" id="export-panel" role="menu">
						<button role="menuitem" data-export="glb"><b>glTF Binary</b><em>.glb · geometry + materials</em></button>
						<button role="menuitem" data-export="stl"><b>STL Binary</b><em>.stl · 3D printing</em></button>
						<button role="menuitem" data-export="obj"><b>Wavefront OBJ</b><em>.obj · plain text</em></button>
						<hr>
						<button role="menuitem" data-export="json"><b>Document JSON</b><em>.json · editable node chain</em></button>
					</div>
				</div>
			</div>
		</header>

		<main class="stage">
			<aside class="panel chain-panel" id="chain-panel">
				<div class="panel-head">
					<h2>Modifier chain</h2>
					<span class="count" id="node-count">0</span>
				</div>

				<div class="chain" id="chain"></div>

				<div class="add-row">
					<span class="add-label">Add primitive</span>
					<div class="add-grid" id="add-grid"></div>
				</div>

				<div class="panel-foot">
					<label class="toggle">
						<input type="checkbox" id="auto-rotate">
						<span>Auto-rotate</span>
					</label>
					<button class="ghost-btn" id="reset-view">Reset view</button>
				</div>
			</aside>

			<section class="viewport-wrap">
				<div id="viewport"></div>

				<div class="viewtools" role="group" aria-label="Display mode">
					<button class="seg" data-mode="solid" aria-pressed="true">Solid</button>
					<button class="seg" data-mode="wireframe" aria-pressed="false">Wire</button>
					<button class="seg" data-mode="xray" aria-pressed="false">X-ray</button>
				</div>

				<div class="section-tools" id="section-tools">
					<label class="toggle">
						<input type="checkbox" id="section-enabled">
						<span>Section</span>
					</label>
					<select id="section-axis" aria-label="Section axis">
						<option value="x">X</option>
						<option value="y">Y</option>
						<option value="z">Z</option>
					</select>
					<input type="range" id="section-offset" min="-4" max="4" step="0.02" value="0" aria-label="Section offset">
				</div>

				<div class="hud" id="hud">
					<div class="hud-row"><span>triangles</span><b id="hud-tris">—</b></div>
					<div class="hud-row"><span>evaluate</span><b id="hud-eval">—</b></div>
					<div class="hud-row"><span>reused</span><b id="hud-reused">—</b></div>
					<div class="hud-row"><span>fps</span><b id="hud-fps">—</b></div>
					<div class="hud-row"><span>queue</span><b id="hud-queue">0</b></div>
					<div class="hud-foot" id="hud-mode">worker ×1</div>
				</div>

				<div class="status" id="status" role="status" aria-live="polite">
					<span class="dot"></span><span id="status-text">Ready</span>
				</div>
			</section>

			<aside class="panel inspector" id="inspector">
				<div class="panel-head">
					<h2>Inspector</h2>
					<span class="badge" id="inspector-kind">—</span>
				</div>
				<div class="inspector-body" id="inspector-body"></div>
			</aside>
		</main>

		<nav class="mobile-tabs" id="mobile-tabs">
			<button data-sheet="chain" aria-pressed="false">Chain</button>
			<button data-sheet="inspector" aria-pressed="false">Inspector</button>
			<button data-sheet="none" aria-pressed="true">Viewport</button>
		</nav>
	</div>

	<script type="module" src="./workbench/main.js"></script>
</body>
</html>
